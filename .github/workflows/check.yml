# ============ VoidOS check ============
# Builds the UEFI loader, runs a subset of host suites and boots the ordinary Meson image once in
# QEMU (scripts/test/run.ps1 -Check). Windows only: the toolchain is MSVC, MASM and NASM.

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # ============ toolchain ============

      # 43 scripts expect MSVC under the BuildTools folder; the runner ships the Enterprise edition.
      - name: Map Visual Studio to the BuildTools path
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC not found on the runner' }
          $target = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools"
          if (!(Test-Path $target)) { New-Item -ItemType Junction -Path $target -Target $vs | Out-Null }
          Get-ChildItem "$target\VC\Tools\MSVC" | Select-Object -ExpandProperty Name

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Meson and Ninja
        run: python -m pip install meson==1.12.1 ninja

      # Same Rust as the reference machine: a newer clippy adds lints and fails unchanged code.
      - name: Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --target x86_64-unknown-none
          rustup default 1.98.1
          rustc --version

      - name: QEMU with OVMF
        run: |
          choco install qemu --no-progress -y
          Get-ChildItem "$env:ProgramFiles\qemu\share\edk2-x86_64-code.fd", "$env:ProgramFiles\qemu\share\edk2-i386-vars.fd"
          & "$env:ProgramFiles\qemu\qemu-system-x86_64.exe" --version

      - name: NASM
        run: ./arch/x86/kernel/cpu/percpu/startup/scripts/assembler.ps1 -Download

      # ============ check ============

      - name: Layout check
        run: ./scripts/test/layout-check.ps1

      - name: Build UEFI boot loader
        run: ./arch/x86/boot/uefi/scripts/build.ps1 -BootKernel

      - name: Host tests (Meson + ASan)
        run: |
          meson setup kernel/build/meson-host-tests test --vsenv
          meson test -C kernel/build/meson-host-tests --print-errorlogs

      - name: Build ordinary kernel (Meson + Ninja)
        run: |
          meson setup kernel/build/meson-kernel kernel --vsenv -Dprofile=ordinary
          meson compile -C kernel/build/meson-kernel

      - name: Build QEMU runner and boot ordinary image
        run: |
          meson setup kernel/build/meson-qemu-runner scripts/tooling/qemu-runner --vsenv
          meson compile -C kernel/build/meson-qemu-runner
          meson test -C kernel/build/meson-qemu-runner --print-errorlogs
          ./kernel/build/meson-qemu-runner/qemu_runner.exe --image kernel/build/meson-kernel/kernel.elf --ordinary-shell --smp 4 --boots 1

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: evidence
          path: |
            kernel/build/meson-host-tests/meson-logs/testlog.txt
            kernel/build/qemu-runner-*/*.log
            kernel/build/qemu-runner-*/**/serial.log
            kernel/build/qemu-runner-*/**/results.json
          if-no-files-found: ignore
          retention-days: 7
